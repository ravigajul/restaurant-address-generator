<!doctype html><html><body><h3>US-style application</h3><form>
<label for=fn>First Name</label><input id=fn name=firstName>
<label for=ln>Last Name</label><input id=ln name=lastName>
<label for=em>Email</label><input id=em type=email name=email>
<label for=ph>Phone</label><input id=ph type=tel name=phone>
<label for=bn>Restaurant / Business Name</label><input id=bn name=businessName>
<label for=a1>Street Address</label><input id=a1 name=address1 autocomplete="address-line1">
<label for=a2>Apt / Suite</label><input id=a2 name=address2>
<label for=ct>City</label><input id=ct name=city>
<label for=st>State</label><select id=st name=state><option value="">-- Select --</option></select>
<label for=zp>ZIP Code</label><input id=zp name=zip>
<label for=co>Country</label><select id=co name=country><option value="">-- Select --</option>
<option value=AU>Australia</option><option value=CA>Canada</option><option value=GB>United Kingdom</option><option value=DE>Germany</option><option value=FR>France</option><option value=IT>Italy</option><option value=US>United States</option></select>
<label for=tx>EIN / Tax ID</label><input id=tx name=taxId>
</form>
<script>
// state list loads only after a country is chosen (async), like many real apps
const S={US:'Alabama|Arizona|California|Colorado|District of Columbia|Florida|Georgia|Hawaii|Illinois|Indiana|Kentucky|Louisiana|Maryland|Massachusetts|Michigan|Minnesota|Missouri|Nevada|New York|North Carolina|Ohio|Oklahoma|Oregon|Pennsylvania|Tennessee|Texas|Utah|Virginia|Washington|Wisconsin'.split('|'),
 AU:['New South Wales','Victoria','Queensland','Western Australia','South Australia','Tasmania','Australian Capital Territory','Northern Territory'],
 CA:['Ontario - ON','British Columbia','Quebec','Alberta','Manitoba','Nova Scotia','Saskatchewan','Newfoundland and Labrador','New Brunswick']};
document.getElementById('co').addEventListener('change',e=>{const s=document.getElementById('st');s.length=1;
 setTimeout(()=>{(S[e.target.value]||[]).forEach((t,i)=>{const v=i;const o=document.createElement('option');o.value=String(i+100);o.textContent=t;s.appendChild(o)})},350)});
</script></body></html>
